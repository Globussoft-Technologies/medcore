name: Auto-merge

# Auto-merge a pull request into `main` once the per-push "Test" workflow
# passes — no human review required (model decided 2026-05-19).
#
# Flow:
#   feature branch → PR targeting main → "Test" workflow runs →
#   on green, this workflow squash-merges the PR automatically, UNLESS
#   the PR has a merge conflict with main (then it's left open + commented).
#
# Why the `workflow_run` trigger:
#   It fires AFTER the "Test" workflow finishes, so
#   `workflow_run.conclusion == 'success'` means ALL of Test's gate jobs
#   passed (API + web tests, typecheck, lint, npm-audit, migration-safety,
#   web-bundle). We then resolve the PR for that commit and merge it.
#   This is self-contained: unlike `gh pr merge --auto`, it needs neither
#   the repo "Allow auto-merge" setting nor a branch-protection rule.
#
# IMPORTANT — token & the downstream deploy:
#   `main` auto-deploys to the dev/demo server via test.yml's `deploy` job
#   (which runs on `push` to main). A merge performed with the default
#   GITHUB_TOKEN does NOT trigger further workflow runs, so the deploy
#   would be skipped. To keep auto-deploy working, add a repo secret
#   `AUTO_MERGE_TOKEN` — a fine-grained PAT with `contents: write` +
#   `pull-requests: write` on this repo. With it set, the post-merge push
#   re-triggers "Test" → `deploy`. Without it, this workflow falls back to
#   GITHUB_TOKEN: the merge still happens, but you must deploy manually.
#
# Governance note: auto-merge + auto-deploy means code reaches a running
# server with no human in the loop. Accepted for the dev/demo target;
# revisit (require a review, or gate on release.yml's E2E suite) before
# pointing this pipeline at any production install.

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]

# Needed to merge the PR and post a skip comment.
permissions:
  contents: write
  pull-requests: write

# One auto-merge at a time — avoids two runs racing to merge into main.
concurrency:
  group: auto-merge-main
  cancel-in-progress: false

jobs:
  auto-merge:
    name: Auto-merge PR into main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Act only when the Test workflow (a) passed and (b) was itself
    # triggered by a pull_request. Push-to-main runs of Test have nothing
    # to merge, so they are skipped here.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Resolve PR, check mergeability, merge
        env:
          # Prefer AUTO_MERGE_TOKEN (a PAT — its push re-triggers the
          # deploy). Fall back to GITHUB_TOKEN if the secret is unset.
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN || secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Find the open, non-draft PR targeting main for the commit the
          # Test workflow ran against. Keyed on the head SHA — robust even
          # if branch names collide.
          PR_NUM=$(gh api "repos/${REPO}/commits/${HEAD_SHA}/pulls" \
            -H "Accept: application/vnd.github+json" \
            --jq '[.[] | select(.state=="open" and .base.ref=="main" and .draft==false)] | first | .number // empty')

          if [ -z "$PR_NUM" ]; then
            echo "::notice::No open, non-draft PR targeting main for ${HEAD_SHA} — nothing to merge."
            exit 0
          fi
          echo "Candidate PR: #${PR_NUM}"

          # GitHub computes `mergeable` asynchronously — poll until it
          # settles (non-null).
          MERGEABLE="null"
          STATE=""
          for i in 1 2 3 4 5 6; do
            INFO=$(gh api "repos/${REPO}/pulls/${PR_NUM}" -H "Accept: application/vnd.github+json")
            MERGEABLE=$(echo "$INFO" | jq -r '.mergeable')
            STATE=$(echo "$INFO" | jq -r '.mergeable_state')
            [ "$MERGEABLE" != "null" ] && break
            echo "mergeability not yet computed (attempt $i) — waiting 5s…"
            sleep 5
          done
          echo "mergeable=${MERGEABLE} mergeable_state=${STATE}"

          # `dirty` / mergeable=false == a real conflict with main. Per the
          # requirement, do NOT merge — leave the PR open and flag it.
          if [ "$MERGEABLE" = "false" ] || [ "$STATE" = "dirty" ]; then
            echo "::warning::PR #${PR_NUM} conflicts with main — auto-merge skipped."
            gh pr comment "$PR_NUM" --repo "$REPO" --body \
              "🚧 **Auto-merge skipped** — this PR has a merge conflict with \`main\`. Resolve the conflict; the next green \`Test\` run will retry the merge." || true
            exit 0
          fi

          # Green + conflict-free → squash-merge, but keep the source branch.
          echo "Merging PR #${PR_NUM} into main…"
          gh pr merge "$PR_NUM" --repo "$REPO" --squash
          echo "::notice::PR #${PR_NUM} auto-merged into main."
