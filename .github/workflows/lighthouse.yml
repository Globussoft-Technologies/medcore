name: Lighthouse budgets (PR — mobile + desktop)

# Closes Pearl SOW §7.3 (PRD M6) NFR: Lighthouse desktop Performance and
# Accessibility >= 90 on the staff PWA shell (Dashboard, OPD Consult
# scribe, Rx Writer prescriptions). Also re-runs the mobile patient PWA
# budget (Perf >= 85, A11y >= 95 — same `.lighthouserc.json`) on PRs so
# regressions surface pre-merge.
#
# **PR-only as of 2026-05-24 (Pearl decision doc #7).** The on-push-to-main
# trigger was moved into `test.yml` as the `lhci` job — that pathway is
# the deploy gate for the PRD §6.2 mobile budget. Keeping the desktop
# pass here (PR-only) avoids doubling the deploy critical path; staff
# Perf/A11y >=90 is the M6 commitment, not the M5 hard-gate.
#
# Fails the build (and therefore blocks merge to main on PRs that touch
# apps/web/**) if either budget regresses. Budgets live in
# `.lighthouserc.json` (mobile, patient routes) and
# `.lighthouserc.desktop.json` (desktop, staff routes) at the repo root;
# this workflow only orchestrates the build + serve + measure dance and
# runs LHCI autorun twice — once per config — so a regression in either
# form factor turns the job red.
#
# Cost shape: ~12-15 min on ubuntu-latest (one shared build, then two
# autorun passes). Scoped to PRs that touch apps/web/** plus either
# LHCI config or this workflow itself, so most PRs do not pay the cost.

on:
  pull_request:
    paths:
      - "apps/web/**"
      - ".lighthouserc.json"
      - ".lighthouserc.desktop.json"
      - ".github/workflows/lighthouse.yml"

permissions:
  contents: read

# One run per ref — supersede in-flight runs when a new commit lands so
# we don't queue stale measurements behind the latest source.
concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lhci:
    name: Lighthouse budgets — mobile (patient >=85/95) + desktop (staff >=90/90)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma client
        # next build imports shared types whose generation triggers
        # prisma generate; without this `npm --prefix apps/web run build`
        # errors on missing `@prisma/client` types. Mirrors the web-bundle
        # job in test.yml.
        run: npm run db:generate

      - name: Build web (production)
        env:
          # Next.js 16's worker pool needs more heap than the default
          # 2 GB on ubuntu-latest. Inherited from the web-bundle job in
          # test.yml — keep the two in lockstep when one changes.
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm --prefix apps/web run build

      - name: Start web server (background)
        # Boot `next start` in the background and poll /patient (the
        # PWA shell entry, present in apps/web/src/app/patient/page.tsx)
        # until it accepts connections or 30 seconds elapse. On timeout
        # dump web.log so the run output explains the failure.
        run: |
          npm --prefix apps/web run start > web.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/patient > /dev/null; then
              echo "web server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::web server failed to start within 30s"
          cat web.log
          exit 1

      - name: Run Lighthouse CI (mobile / patient PWA)
        # `npx -y @lhci/cli@latest autorun` reads .lighthouserc.json,
        # collects 1 run per URL, asserts the configured budgets, and
        # uploads the HTML report to temporary public storage (URL
        # printed in the step log). On any assertion failure the CLI
        # exits non-zero and this step — and therefore the workflow —
        # turns red. Mobile config covers the 4 patient PWA anchor
        # routes (Perf >=85, A11y >=95).
        run: npx -y @lhci/cli@latest autorun --config=.lighthouserc.json

      - name: Run Lighthouse CI (desktop / staff PWA shell)
        # Second autorun pass against .lighthouserc.desktop.json. Same
        # dev server, different audit profile (desktop preset, no
        # mobile form-factor emulation). Targets staff PWA shell:
        # /dashboard (home), /dashboard/scribe (OPD Consult), and
        # /dashboard/prescriptions (Rx Writer) — closes Pearl SOW
        # §7.3 row 347 (PRD M6 desktop budget Perf+A11y >=90).
        # Staff routes are auth-gated; Lighthouse runs unauth and the
        # rendered login/redirect chrome is what we score — that's the
        # PRD intent ("the staff PWA shell renders fast"). A fully
        # authenticated audit would require Puppeteer login setup and
        # is deferred.
        run: npx -y @lhci/cli@latest autorun --config=.lighthouserc.desktop.json

      - name: Upload Lighthouse report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: |
            .lighthouseci/
            web.log
          retention-days: 14
          if-no-files-found: ignore
