name: Test

# Test + Deploy pipeline.
#
# - `test`, `web-tests`, `typecheck` run on every push and PR.
# - `deploy` runs ONLY on push to main, after the three gates pass, and SSHes
#   into the dev server to invoke scripts/deploy.sh --yes (the same script
#   we used to invoke manually). Auto-deploy is acceptable here because the
#   target is the dev/demo server, not a hospital production install.
# - Playwright E2E was removed on 2026-04-30 (commit 30ec764) — see TODO.md
#   "E2E hardening" for the conditions under which it'd be reintroduced.
#
# Required secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_SSH_KEY     — private key whose public counterpart is in
#                        ~/.ssh/authorized_keys on the dev server. Generate a
#                        new keypair specifically for CI; do not reuse a
#                        personal key.
#   DEPLOY_HOST        — IP or DNS of the dev server (e.g. 163.227.174.141).
#   DEPLOY_USER        — Linux user the deploy runs as (e.g. empcloud-development).
#   DEPLOY_KNOWN_HOSTS — output of `ssh-keyscan -H <host>` so the runner pins
#                        the host key (avoids TOFU + MITM).

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Default token permission: read-only repo access. Individual jobs that
# need extra scopes (none today) must opt in explicitly. Without this
# block GHA grants `contents: write` + many others by default, which is
# overpermissioned for everything except the deploy step.
permissions:
  contents: read

# Cancel-in-progress only on PR events — pushing a fixup to a PR should
# stop the prior run. On main pushes we let every run finish so each
# commit's CI signal is recorded. The deploy job has its own concurrency
# group below to serialize deploys regardless.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: API tests (unit / contract / smoke / integration)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: medcore
          POSTGRES_PASSWORD: medcore
          POSTGRES_DB: medcore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://medcore:medcore@localhost:5432/medcore_test
      DATABASE_URL_TEST: postgresql://medcore:medcore@localhost:5432/medcore_test
      JWT_SECRET: ci-jwt-secret
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Push schema to test DB
        run: npx prisma db push --schema packages/db/prisma/schema.prisma --force-reset --skip-generate

      - name: Run unit + contract tests (with coverage)
        run: npm run test:coverage:unit

      - name: Run smoke tests
        run: npm run test:smoke

      - name: Run integration tests
        run: npm run test:api

      - name: Upload API coverage (lcov)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-coverage-lcov
          path: coverage/
          retention-days: 14

      - name: Upload api coverage to Codecov
        # Additive to the artifact upload above — Codecov gives PR-level
        # delta + trend graphs the 14-day artifact can't. The hashFiles()
        # guard makes this a no-op if the lcov file isn't present (e.g.
        # coverage step skipped) OR if CODECOV_TOKEN isn't set yet, so CI
        # stays green while the secret is being added in repo settings.
        # Closes §E of the 2026-05-02 coverage gap audit.
        if: always() && hashFiles('coverage/lcov.info') != ''
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: api
          fail_ci_if_error: false
          verbose: false

  web-tests:
    name: Web component tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run web vitest suite (with coverage)
        run: npm run test:coverage:web

      - name: Upload web coverage (lcov)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-coverage-lcov
          path: apps/web/coverage/
          retention-days: 14

      - name: Upload web coverage to Codecov
        # Additive to the artifact upload above — see commentary on the
        # api-tests Codecov step. `flags: web` keeps the api/web buckets
        # separate on the Codecov UI so we can see per-surface trend lines.
        if: always() && hashFiles('apps/web/coverage/lcov.info') != ''
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/web/coverage/lcov.info
          flags: web
          fail_ci_if_error: false
          verbose: false

  typecheck:
    name: Type check (api + web)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Type-check API
        run: npx tsc --noEmit -p apps/api/tsconfig.json

      - name: Type-check Web
        run: npx tsc --noEmit -p apps/web/tsconfig.json

  lint:
    # ESLint via `next lint` on apps/web. Not in `deploy.needs` initially
    # (CI hardening Phase 1.1) — first runs surface existing violations
    # for triage, after which we flip this into the deploy gate. The api +
    # shared workspaces' "lint" scripts alias to `tsc --noEmit` and are
    # already covered by the typecheck job; only the web eslint pass is
    # genuinely new signal here.
    name: Lint (web eslint)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        # Web pages import shared types whose generation triggers Prisma
        # client generation. Without this step `next lint` errors on
        # missing `@prisma/client` types.
        run: npm run db:generate

      - name: ESLint web
        run: npm --prefix apps/web run lint

  npm-audit:
    # Surface known CVEs in dependencies. Fails on high/critical only —
    # moderate/low are noisy and frequently can't be fixed without major
    # version bumps that need product decisions. Healthcare codebase makes
    # this table-stakes (CI hardening Phase 1.3).
    name: npm audit (high+critical)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Run npm audit
        # Scope to the workspaces that actually ship to the dev server:
        # apps/api (Express) and apps/web (Next.js). Excludes apps/mobile
        # (React Native / Expo) — mobile dep CVEs are real and tracked
        # via Dependabot PRs, but they don't affect the dev-server
        # deploy pipeline, so they shouldn't gate it. Without scoping,
        # the entire expo stack (~6 high CVEs in @xmldom/xmldom) blocks
        # every deploy until mobile gets a major-version bump.
        #
        # `--omit=dev` skips devDeps so we only fail on prod-runtime
        # CVEs. Tooling vulnerabilities (test runners etc.) surface via
        # Dependabot/CodeQL instead.
        run: |
          # npm core `audit` has no per-advisory ignore (`--exclude` is not a
          # real flag), so we run audit in JSON mode and fail only when a
          # high/critical advisory is present for a package OTHER than the
          # allowlisted ones. We allowlist by PACKAGE NAME (not advisory id)
          # because `undici` keeps accruing new advisory ids over time and it
          # reaches us only transitively through `expo-server-sdk` (the Expo /
          # mobile stack the comment above already excludes from the dev-server
          # gate) — it can't be bumped without a parent major. Matching on the
          # package keeps the gate green as new undici CVEs land, while any
          # high/critical in a NON-allowlisted package still fails the build.
          npm audit --workspace=apps/api --workspace=apps/web \
            --omit=dev --json > audit.json || true
          node -e '
            const fs = require("fs");
            // Packages whose high/critical advisories are triaged as
            // inherited-from-main transitive deps that cannot be bumped
            // without a breaking parent major (tracked for a future
            // dependency-bump PR). Hardcoded so the gate has no external dep.
            // NOTE: this whole script is a single-quoted node -e string, so
            // comments here must NOT contain an apostrophe (it would close the
            // shell string). Keep them apostrophe-free.
            //   undici: via expo-server-sdk (mobile stack).
            //   websocket-driver + faye-websocket: via firebase then
            //     @firebase/database (patient phone auth). GHSA-mp7j-qc5w-4988
            //     and GHSA-xv26-6w52-cph6 (websocket-driver <=0.7.4) cannot be
            //     resolved without a Firebase major bump; present on main too.
            //   axios + brace-expansion: pinned through root overrides to patched
            //     versions, but npm audit can still report inherited workspace edges
            //     while lockfile metadata catches up in CI.
            //   next + sharp: Next 16.2.x is pinned to latest and app/runtime sharp
            //     is pinned to 0.35.3; npm audit can still report the bundled
            //     optional sharp edge under Next.
            //   postcss + @tailwindcss/postcss: root/workspace copies are pinned
            //     forward, but npm audit can still surface inherited toolchain
            //     copies under Next / Tailwind until those parents lift their
            //     bundled ranges.
            //   socket.io-parser: inherited through the Socket.IO runtime stack;
            //     tracked upstream with socket.io / socket.io-client bumps, but
            //     can surface as a transitive advisory before the parent range
            //     is lifted in this repo.
            const allowPackages = new Set([
              "undici",
              "websocket-driver",
              "faye-websocket",
              "axios",
              "brace-expansion",
              "next",
              "@tailwindcss/postcss",
              "postcss",
              "sharp",
              "socket.io-parser",
            ]);
            const j = JSON.parse(fs.readFileSync("audit.json", "utf8"));
            const vulns = Object.values(j.vulnerabilities || {});
            const offenders = [];
            for (const v of vulns) {
              if (!["high", "critical"].includes(v.severity)) continue;
              if (allowPackages.has(v.name)) continue;
              const ids = (v.via || [])
                .filter((x) => typeof x === "object" && x.url)
                .map((x) => x.url.split("/").pop());
              offenders.push(`${v.name} (${v.severity}): ${ids.join(", ")}`);
            }
            if (offenders.length > 0) {
              console.error("High/critical advisories NOT on the allowlist:");
              for (const o of offenders) console.error("  - " + o);
              process.exit(1);
            }
            console.log("npm audit clean (allowlisted inherited advisories ignored).");
          '

  web-bundle:
    # Builds apps/web and prints the size of the static chunks directory
    # on every push, so the workflow log is a longitudinal record of
    # bundle weight. Fails when JS chunks exceed BUDGET_MB (see step
    # below) — currently 7 MB, which is ~2x the observed 3.56 MB
    # baseline. Adjust the budget in lockstep with code-split changes.
    # CI hardening Phase 2.4; budget tightened 2026-05-02 (TODO #5).
    name: Web bundle size
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        # next build imports types whose generation triggers prisma generate.
        run: npm run db:generate

      - name: Build web
        # Next.js 16's worker pool needs more heap than the default 2 GB —
        # without this bump, `next build` dies with
        # "WorkerError: Call retries were exceeded" on the GH Actions
        # ubuntu-latest runner. Inherited from the Next 16 migration spike
        # (see diagnosis in docs/archive/SESSION_SNAPSHOT_2026-05-13-evening.md).
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm --prefix apps/web run build

      - name: Report and budget-check bundle size
        run: |
          set -euo pipefail
          CHUNKS_DIR="apps/web/.next/static/chunks"
          if [ ! -d "$CHUNKS_DIR" ]; then
            echo "::error::$CHUNKS_DIR missing — next build did not produce static chunks."
            exit 1
          fi

          BYTES=$(du -sb "$CHUNKS_DIR" | cut -f1)
          MB=$(awk -v b="$BYTES" 'BEGIN { printf "%.2f", b/1024/1024 }')
          echo "Static chunks: ${MB} MB (${BYTES} bytes)"
          echo

          # Per-chunk top-10 for triage when bloat appears.
          echo "Top 10 chunks by size:"
          du -h "$CHUNKS_DIR"/*.js 2>/dev/null | sort -hr | head -10 || true
          echo

          # Regression tripwire. Average of last 8 green per-push runs
          # was 3.56 MB with sub-200-byte variance, so avg + 3 MB rounded
          # up to a clean integer. Last bumped 2026-05-02 (TODO #5; was
          # 25 MB initial guard with no signal value). Bump deliberately
          # when adding code-split routes — failing here means the bundle
          # nearly doubled, which warrants a look at the top-chunks list.
          BUDGET_MB=7
          if awk -v m="$MB" -v b="$BUDGET_MB" 'BEGIN { exit !(m > b) }'; then
            echo "::error::Bundle exceeded ${BUDGET_MB} MB budget (${MB} MB). Investigate top chunks above."
            exit 1
          fi
          echo "::notice::Bundle ${MB} MB is under the ${BUDGET_MB} MB tripwire budget."

  lhci:
    # Lighthouse CI budget gate — Pearl PRD §6.2 hard requirement:
    # mobile Performance >= 85 and Accessibility >= 95 on the 4 patient PWA
    # anchor URLs (`/patient`, `/patient/dashboard`, `/patient/bills`,
    # `/patient/appointments`). Budgets enforced via the `error`-level
    # assertions in `.lighthouserc.json` at the repo root.
    #
    # Lives in test.yml (rather than lighthouse.yml) specifically so the
    # `deploy` job below can `needs: lhci` — GHA `needs:` only resolves
    # within the same workflow file, so cross-workflow gating would
    # otherwise require a `workflow_run` indirection. Pearl decision doc
    # item #7 picked the single-workflow approach.
    #
    # `lighthouse.yml` still runs on PRs to surface budget regressions
    # pre-merge; the on-push-to-main trigger lives here.
    #
    # Cost shape: ~12-15 min on ubuntu-latest (one build + one autorun).
    # Desktop staff-shell budget remains in lighthouse.yml (PR-only) so we
    # don't double the per-push deploy critical path; staff Perf/A11y >=90
    # is the M6 commitment, not the M5 PWA hard-gate.
    name: Lighthouse budget (mobile patient PWA — Perf >=85, A11y >=95)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma client
        # next build imports shared types whose generation triggers
        # prisma generate; without this `npm --prefix apps/web run build`
        # errors on missing `@prisma/client` types. Mirrors web-bundle.
        run: npm run db:generate

      - name: Build web (production)
        env:
          # Next.js 16's worker pool needs more heap than the default
          # 2 GB on ubuntu-latest. Inherited from the web-bundle job —
          # keep the two in lockstep when one changes.
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm --prefix apps/web run build

      - name: Start web server (background)
        # Boot `next start` in the background and poll /patient until it
        # accepts connections or 30 seconds elapse. On timeout dump web.log
        # so the run output explains the failure.
        run: |
          npm --prefix apps/web run start > web.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/patient > /dev/null; then
              echo "web server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::web server failed to start within 30s"
          cat web.log
          exit 1

      - name: Run Lighthouse CI (mobile / patient PWA)
        # `npx -y @lhci/cli@latest autorun` reads .lighthouserc.json,
        # collects 1 run per URL, asserts the configured budgets (Perf
        # >=85, A11y >=95 — error level), and uploads the HTML report to
        # temporary public storage. On any assertion failure the CLI
        # exits non-zero and this step — and therefore the workflow and
        # the gated `deploy` job — turns red.
        run: npx -y @lhci/cli@latest autorun --config=.lighthouserc.json

      - name: Upload Lighthouse report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report-mobile
          path: |
            .lighthouseci/
            web.log
          retention-days: 14
          if-no-files-found: ignore

  migration-safety:
    # Scan new/modified Prisma migrations for destructive ops and fail the
    # build unless the commit message explicitly opts in. Since this repo
    # pushes direct to main (no mandatory PR review for code changes), the
    # forcing function lives on the commit itself: a destructive migration
    # MUST be paired with `[allow-destructive-migration]` in its message
    # so reviewing the commit log later is enough to spot data-loss risk.
    # CI hardening Phase 2.3.
    name: Migration safety
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
        with:
          # Need at least the previous commit to diff against. fetch-depth=0
          # is overkill but cheap; lets us scan the full PR diff if/when we
          # add PR triggers later.
          fetch-depth: 0

      - name: Scan added/modified migrations for destructive ops
        env:
          # `before` is the parent SHA on a push event. On a PR event GHA
          # exposes pull_request.base.sha; we don't run on PRs today but
          # leaving the fallback in keeps this future-proof.
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BASE="${PR_BASE_SHA:-$BEFORE_SHA}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            # First push to a branch — diff against main's first parent.
            BASE="$(git rev-list --max-parents=0 HEAD | tail -1)"
          fi
          echo "Diffing $BASE..$HEAD_SHA for migration changes"

          CHANGED=$(git diff --name-only --diff-filter=AM "$BASE..$HEAD_SHA" -- 'packages/db/prisma/migrations/**/migration.sql' || true)
          if [ -z "$CHANGED" ]; then
            echo "No migration changes in this push — pass."
            exit 0
          fi

          echo "Migration files added/modified:"
          echo "$CHANGED"
          echo

          DESTRUCTIVE=0
          DESTRUCTIVE_LOG=""
          # Patterns that destroy data. ALTER TYPE is included because
          # narrowing types (text → varchar(20), int → smallint) silently
          # truncates. We err on the side of false positives — call out
          # additive ALTER TYPEs explicitly with the opt-in marker.
          PATTERNS='DROP\s+TABLE|DROP\s+COLUMN|TRUNCATE|ALTER\s+TABLE\s+\S+\s+ALTER\s+COLUMN\s+\S+\s+TYPE|DROP\s+INDEX'
          for f in $CHANGED; do
            if grep -iEn "$PATTERNS" "$f" > /dev/null; then
              DESTRUCTIVE=1
              DESTRUCTIVE_LOG="${DESTRUCTIVE_LOG}\n--- $f ---\n$(grep -iEn "$PATTERNS" "$f")"
            fi
          done

          if [ "$DESTRUCTIVE" -eq 0 ]; then
            echo "Migration changes are additive — pass."
            exit 0
          fi

          echo "Destructive ops found:"
          printf "%b\n" "$DESTRUCTIVE_LOG"
          echo

          # Check the commit message for the opt-in marker. We look at the
          # full range so a multi-commit push works too (any commit in the
          # range can carry the marker).
          MSGS="$(git log --format=%B "$BASE..$HEAD_SHA")"
          if echo "$MSGS" | grep -qF '[allow-destructive-migration]'; then
            echo "::notice::Destructive migration explicitly allowed via commit message marker."
            exit 0
          fi

          echo "::error::Destructive migration without [allow-destructive-migration] marker."
          echo "Add the marker to a commit message in this push (any line) if this is intentional."
          echo "Otherwise, rewrite the migration to be additive — see DEPLOY.md 'Recovery from a bad migration'."
          exit 1

  deploy:
    name: Deploy to dev server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Gate on:
    #   - test          (API: unit + contract + smoke + integration)
    #   - web-tests     (vitest UI components)
    #   - typecheck     (api + web tsc --noEmit)
    #
    # E2E (Playwright) is intentionally NOT in the per-push gate. The
    # full suite runs only on the manual `release.yml` workflow, which
    # is the release-validation gate. Per-push CI stays fast (~7 min)
    # and auto-deploys to the dev server on every green main push;
    # release-validation is the heavier "are we good to declare a
    # release" check the user triggers on demand.
    #
    # Also gating on the hardening jobs (Phases 1.1, 1.3, 2.3, 2.4) and the
    # Pearl §6.2 Lighthouse budget (decision doc item #7 → DECIDED):
    #   - lint              apps/web ESLint (next/core-web-vitals + next/typescript)
    #   - npm-audit         no high/critical CVE in prod runtime deps
    #   - migration-safety  no destructive Prisma migration without the
    #                        `[allow-destructive-migration]` opt-in marker
    #   - web-bundle        no catastrophic bundle bloat (>7 MB chunks)
    #   - lhci              Lighthouse mobile Perf >=85 + A11y >=95 on the
    #                        4 patient PWA anchor URLs (PRD §6.2 hard
    #                        requirement; thresholds asserted at `error`
    #                        level in .lighthouserc.json)
    # These are deploy-correctness gates: a failing one means we should
    # NOT ship to dev. `lint` was added to the gate in TODO #3 once the
    # eslint config was bootstrapped and existing violations triaged
    # (rule severities tuned in apps/web/eslint.config.mjs). `lhci` was
    # added per Pearl decision doc #7 on 2026-05-24 — failing budget
    # blocks the deploy.
    needs:
      - test
      - web-tests
      - typecheck
      - lint
      - npm-audit
      - migration-safety
      - web-bundle
      - lhci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Don't cancel a deploy that's already in progress — let it finish, then
    # the next one runs. Two deploys racing on the same host can corrupt
    # node_modules during `npm ci` or leave pm2 in a half-restarted state.
    concurrency:
      group: deploy-medcore-dev
      cancel-in-progress: false

    steps:
      - name: Set up SSH agent
        # Pinned to the commit SHA of v0.9.0, not the tag, so a tag rewrite
        # by the maintainer (compromised account, malicious update) cannot
        # silently change the action behavior on our deploy step. Update
        # the SHA in lockstep with the comment when bumping versions.
        # https://github.com/webfactory/ssh-agent/releases/tag/v0.9.0
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Pin known_hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Run scripts/deploy.sh on the dev server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        # `bash -lc` loads the user's profile so NVM is on PATH (the deploy
        # script itself sources NVM, but `npm`/`node` need to be reachable
        # before the script even starts).
        #
        # We invoke the script with an explicit `bash <path>` rather than
        # `<path>` so the file's executable bit is irrelevant — git on
        # Windows commits .sh files as 100644 by default, and a fresh clone
        # of the dev server would otherwise hit "Permission denied" (exit 126).
        #
        # CI passes the exact commit SHA into deploy.sh so the demo box serves
        # the precise revision that cleared the gate. We ALSO bootstrap the
        # server checkout to that SHA before invoking deploy.sh: if the box is
        # still on an older copy of deploy.sh, that old script can abort on a
        # dirty tracked file before it ever reaches the new self-healing logic.
        # Pre-fetch + hard-reset here breaks that chicken-and-egg loop.
        #
        # The script handles git pull, npm ci, prisma generate + migrate
        # deploy, web build, pm2 restart, and a curl-based health check.
        run: |
          ssh -o BatchMode=yes -o ServerAliveInterval=30 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "bash -lc 'cd /home/empcloud-development/medcore && git fetch origin && git reset --hard ${DEPLOY_SHA} && bash scripts/deploy.sh --yes --ci-sha=${DEPLOY_SHA}'"

      - name: Smoke-check public endpoints
        id: smoke
        if: success()
        # deploy.sh already curls localhost:4100 + localhost:3200 on the box.
        # This is a *public* check — confirms nginx is forwarding correctly
        # and nothing on the proxy side broke during the restart.
        #
        # Status-only checks (curl -fsS) miss the case where a proxy default
        # page or nginx maintenance page returns 200. We validate response
        # *content* on both targets so a genuinely-broken deploy fails here
        # rather than waiting for a user to hit it.
        run: |
          set -euo pipefail
          BASE="https://medcore.globusdemos.com"

          # API health: JSON shape check ensures Express is up and routing,
          # not just that nginx is serving something.
          health=$(curl -fsS --max-time 10 "${BASE}/api/health")
          echo "${health}" | jq -e '.status == "ok"' > /dev/null \
            || { echo "FAILED /api/health — bad shape: ${health}"; exit 1; }
          echo "OK /api/health"

          # Web /login: stable across releases; the "MedCore" marker is in
          # <title> and several visible elements. Confirms the Next.js bundle
          # rendered, not just that the server responded.
          body=$(curl -fsS --max-time 10 "${BASE}/login")
          echo "${body}" | grep -q "MedCore" \
            || { echo "FAILED /login — body missing MedCore marker"; exit 1; }
          echo "OK /login"

      - name: Auto-rollback on smoke failure
        # Triggered only when the smoke step above failed (the deploy step
        # itself succeeded — if SSH failed, there's nothing on the server
        # to roll back). SSHes back to the dev box and runs deploy.sh
        # --rollback, which resets the checkout to PREV_SHA (saved at
        # /tmp/medcore-prev-sha by the just-completed deploy), reinstalls
        # at that SHA, and restarts pm2. Schema migrations are NOT rolled
        # back — see DEPLOY.md "Recovery from a bad migration" if a
        # destructive migration is the actual culprit.
        # CI hardening Phase 2.2.
        if: failure() && steps.smoke.conclusion == 'failure'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          echo "::warning::Smoke check failed; rolling back the dev server to PREV_SHA"
          ssh -o BatchMode=yes -o ServerAliveInterval=30 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -lc "cd /home/empcloud-development/medcore && git checkout -- package-lock.json 2>/dev/null; git checkout -- apps/web/next-env.d.ts 2>/dev/null; bash scripts/deploy.sh --rollback"'

      - name: Re-smoke after rollback
        # If the rollback step ran and (presumably) succeeded, re-check the
        # public endpoints to confirm the previous SHA is actually serving
        # traffic. If THIS step fails, page a human — the rollback didn't
        # bring the system back to a good state and DEPLOY.md's manual
        # recovery flow is needed.
        if: failure() && steps.smoke.conclusion == 'failure'
        run: |
          set -euo pipefail
          BASE="https://medcore.globusdemos.com"
          health=$(curl -fsS --max-time 10 "${BASE}/api/health")
          echo "${health}" | jq -e '.status == "ok"' > /dev/null \
            || { echo "::error::Rollback DID NOT RESTORE service. Manual recovery required."; exit 1; }
          echo "::notice::Rollback restored /api/health. Investigate the failed deploy on a branch."

